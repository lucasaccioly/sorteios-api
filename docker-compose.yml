# Optional: run API + Postgres locally with `docker compose up --build`, then open http://localhost:8080
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: sorteios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DATABASE_URL: jdbc:postgresql://db:5432/sorteios
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: local-docker-secret-change-me-0123456789abcdef
    depends_on:
      db:
        condition: service_healthy

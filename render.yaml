services:
  - type: web
    name: sorteios-api
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: DATABASE_URL # jdbc:postgresql://<host>/<db>?sslmode=require
        sync: false
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: JWT_SECRET # 32+ bytes
        sync: false
